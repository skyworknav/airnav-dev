apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
  namespace: demo-app-staging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-demo-app

  template:
    metadata:
      labels:
        app: cicd-demo-app

    spec:
      containers:
        - name: cicd-demo-app

          image: 192.168.10.23:5000/cicd-demo-app:staging-10a3298
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: ENVIRONMENT
              value: "staging"

            - name: APP_VERSION
              value: "staging-a3ffa0a"

            # PostgreSQL
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: cicd-staging-db
                  key: PGHOST

            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: cicd-staging-db
                  key: PGPORT

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: cicd-staging-db
                  key: PGDATABASE

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: cicd-staging-db
                  key: PGUSER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cicd-staging-db
                  key: PGPASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
