apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
  namespace: demo-app-staging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-demo-app

  template:
    metadata:
      labels:
        app: cicd-demo-app

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cicd-demo-app

      containers:
        - name: cicd-demo-app

          image: 192.168.10.23:5000/cicd-demo-app:v1.0.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - secretRef:
                name: postgres-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
