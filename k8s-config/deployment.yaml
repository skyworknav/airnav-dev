# Initial configs not final

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
  namespace: demo-app-staging
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-demo-app

  template:
    metadata:
      labels:
        app: cicd-demo-app

    spec:
      containers:
        - name: cicd-demo-app
          image: 192.168.10.23:5000/cide-demo-app:staging-a3ffa0a

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
