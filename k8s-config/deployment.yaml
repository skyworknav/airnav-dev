apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
  namespace: demo-app-prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-demo-app

  template:
    metadata:
      labels:
        app: cicd-demo-app

    spec:
      containers:
        - name: cicd-demo-app

          # PLACEHOLDER
          # Replace with the production image
          # created by Jenkins.
          image: 192.168.10.23:5000/cicd-demo-app:<PRODUCTION_TAG>

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: ENVIRONMENT
              value: "production"

            # Replace after Jenkins creates the
            # actual production image tag.
            - name: APP_VERSION
              value: "<PRODUCTION_TAG>"

            # PostgreSQL - PLACEHOLDERS
            - name: PGHOST
              value: "<POSTGRES_HOST>"

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              value: "<PRODUCTION_DATABASE>"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
