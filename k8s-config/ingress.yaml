
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: login-app
  namespace: demo-app-staging
spec:
  ingressClassName: traefik

  rules:
    - host: cicd-demo-staging.192.168.8.121.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: cicd-demo-app
                port:
                  number: 80
