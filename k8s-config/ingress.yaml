
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: login-app
  namespace: startup
spec:
  ingressClassName: traefik

  rules:
    - host: login-staging.<DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: login-app
                port:
                  number: 80
